<!doctype html>
<html lang="en">
  <head>
    <title>Course Registration Form</title>
  </head>
  <body>
    <h1>Course Registration Form</h1>
    <p>Please fill out the form below to register for a course.</p>

    <form action="#" method="post">
      <fieldset>
        <legend>Student Information</legend>

        <label for="name">Student Name:</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your full name"
          required
        />
        <br /><br />

        <label for="rollno">Roll Number:</label>
        <input
          type="text"
          id="rollno"
          name="rollno"
          placeholder="Enter your roll number"
          required
        />
        <br /><br />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
        <br /><br />

        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          minlength="8"
          required
        />
        <br /><br />

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="18" max="60" />
        <br /><br />

        <label for="date">Registration Date:</label>
        <input type="date" id="date" name="date" />
        <br /><br />
      </fieldset>

      <br />

      <fieldset>
        <legend>Course Details</legend>

        <p>Study Mode:</p>

        <input type="radio" id="online" name="mode" value="online" checked />
        <label for="online">Online</label>

        <input type="radio" id="onsite" name="mode" value="onsite" />
        <label for="onsite">On Campus</label>

        <br /><br />

        <label for="course">Select Course:</label>
        <select id="course" name="course" required>
          <option value="">-- Select a Course --</option>
          <option value="web">Web Engineering</option>
          <option value="programming">Programming</option>
          <option value="database">Database Systems</option>
        </select>

        <br /><br />

        <label for="comments">Additional Comments:</label><br />
        <textarea
          id="comments"
          name="comments"
          rows="5"
          cols="40"
          maxlength="200"
        ></textarea>
      </fieldset>

      <br />

      <input type="checkbox" id="terms" name="terms" required />
      <label for="terms">I agree to the terms and conditions.</label>

      <br />

      <input type="checkbox" id="confirm" name="confirm" required />
      <label for="confirm">I confirm that the information is correct.</label>

      <br /><br />

      <input type="submit" value="Register" />
      <input type="reset" value="Clear Form" />
    </form>
  </body>
</html>
