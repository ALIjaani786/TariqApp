<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Employees</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { padding: 25px 30px; background: #f4f6fb; }

  .page-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 25px; flex-wrap: wrap; gap: 10px;
  }
  .page-header h1 { font-size: 24px; color: #1e2235; }
  .page-header p { color: #7a7f9e; font-size: 14px; margin-top: 4px; }
  .add-btn {
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    border: none; padding: 10px 20px; border-radius: 8px;
    cursor: pointer; font-weight: 600; transition: 0.2s;
  }
  .add-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }

  .table-card {
    background: #fff; border-radius: 12px; padding: 22px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05); overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; min-width: 600px; }
  table th {
    text-align: left; padding: 12px 14px; font-size: 13px;
    text-transform: uppercase; color: #7a7f9e;
    border-bottom: 2px solid #eef0f6; letter-spacing: 0.5px;
  }
  table td { padding: 14px; border-bottom: 1px solid #f1f3f8; font-size: 14px; color: #333; }
  table tr:hover td { background: #fafbff; }
  .action-btn {
    border: none; padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-weight: 600; margin-right: 5px;
  }
  .action-btn.edit { background: #eaf2ff; color: #2980b9; }
  .action-btn.delete { background: #fdecea; color: #c0392b; }
  .action-btn:hover { opacity: 0.8; }
</style>
</head>
<body>

<div class="page-header">
  <div>
    <h1>Employees</h1>
    <p>Manage all employees of your company</p>
  </div>
  <button class="add-btn">+ Add Employee</button>
</div>

<div class="table-card">
  <table>
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Designation</th>
        <th>Email</th><th>Salary</th><th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>#E001</td><td>Ahmed Raza</td><td>Manager</td>
        <td>ahmed@company.com</td><td>Rs 85,000</td>
        <td>
          <button class="action-btn edit">Edit</button>
          <button class="action-btn delete">Delete</button>
        </td>
      </tr>
      <tr>
        <td>#E002</td><td>Hina Malik</td><td>Accountant</td>
        <td>hina@company.com</td><td>Rs 60,000</td>
        <td>
          <button class="action-btn edit">Edit</button>
          <button class="action-btn delete">Delete</button>
        </td>
      </tr>
      <tr>
        <td>#E003</td><td>Kamran Shah</td><td>Developer</td>
        <td>kamran@company.com</td><td>Rs 95,000</td>
        <td>
          <button class="action-btn edit">Edit</button>
          <button class="action-btn delete">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
